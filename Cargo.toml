[workspace]
resolver = "3"
members = ["apps/runner", "apps/server", "crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MDReal32/mcpkit"

[workspace.dependencies]
mcpkit-manifest = { path = "crates/manifest" }
mcpkit-wire-log = { path = "crates/wire-log" }
clap = { version = "4.6", features = ["derive", "env"] }
humantime = "2.4"
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tao = "0.37"
tempfile = "3.27"
url = "2.5"
wry = "0.57"
tokio = { version = "1.54", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

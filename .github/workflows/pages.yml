name: Pages

on:
  push:
    branches:
      - master
    paths:
      - apps/npx/package.json
      - apps/video/**
      - crates/core/**
      - crates/manifest/**
      - crates/napi/**
      - crates/validation/**
      - packages/core/**
      - packages/native/**
      - packages/servers/**
      - Cargo.toml
      - yarn.lock
      - .github/scripts/assemble-registry-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the registry
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build the registry
        uses: ./.github/actions/build-registry
        with:
          cache-key: pages

      - name: Restore the promo video
        id: video-cache
        uses: actions/cache@v6
        with:
          path: apps/video/build/pages
          key: video-${{ hashFiles('apps/video/src/**', 'apps/video/scripts/**', 'apps/video/public/sfx/**', 'apps/video/public/voiceover/**', 'apps/video/site/**', 'apps/video/package.json', 'apps/video/remotion.config.ts', 'yarn.lock') }}

      - name: Install Chrome Headless Shell dependencies
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0

      - name: Render the promo video
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          yarn workspace @usemcpkit/video remotion browser ensure
          yarn workspace @usemcpkit/video pages

      - name: Assemble the versioned registry
        run: .github/scripts/assemble-registry-site.sh packages/servers/build/manifests site
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add the promo video to the site
        run: cp -R apps/video/build/pages site/video

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

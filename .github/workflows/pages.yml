name: Pages

on:
  push:
    branches:
      - master
    paths:
      - apps/npx/package.json
      - crates/core/**
      - crates/manifest/**
      - crates/napi/**
      - crates/validation/**
      - packages/core/**
      - packages/native/**
      - packages/servers/**
      - Cargo.toml
      - yarn.lock
      - .github/scripts/assemble-registry-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the registry
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build the registry
        uses: ./.github/actions/build-registry
        with:
          cache-key: pages

      - name: Assemble the versioned registry
        run: .github/scripts/assemble-registry-site.sh packages/servers/build/manifests site
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the registry
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

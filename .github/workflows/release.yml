name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/release-build.yml

  platforms:
    name: npm platforms
    needs: build
    uses: ./.github/workflows/release-npm-platforms.yml
    with:
      platforms: ${{ needs.build.outputs.platforms }}
    permissions:
      contents: read
      id-token: write

  libraries:
    name: npm libraries
    needs: platforms
    uses: ./.github/workflows/release-npm-libraries.yml
    permissions:
      contents: read
      id-token: write

  github:
    name: GitHub Release
    needs: build
    uses: ./.github/workflows/release-github.yml
    permissions:
      contents: write

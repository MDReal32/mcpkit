name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/release-build.yml

  binaries:
    name: Binaries
    needs: build
    uses: ./.github/workflows/release-binaries.yml

  platforms:
    name: npm platforms
    needs: binaries
    uses: ./.github/workflows/release-npm-platforms.yml
    with:
      platforms: ${{ needs.binaries.outputs.platforms }}
    permissions:
      contents: read
      id-token: write

  core:
    name: npm core
    needs: binaries
    uses: ./.github/workflows/release-npm-package.yml
    with:
      dir: packages/core
    permissions:
      contents: read
      id-token: write

  wrapper:
    name: npm wrapper
    needs: platforms
    uses: ./.github/workflows/release-npm-package.yml
    with:
      dir: apps/npx
    permissions:
      contents: read
      id-token: write

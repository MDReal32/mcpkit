name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/release-build.yml

  platforms:
    name: npm platforms
    needs: build
    uses: ./.github/workflows/release-npm-platforms.yml
    with:
      platforms: ${{ needs.build.outputs.platforms }}
    permissions:
      contents: read
      id-token: write

  core:
    name: npm core
    needs: build
    uses: ./.github/workflows/release-npm-package.yml
    with:
      dir: packages/core
    permissions:
      contents: read
      id-token: write

  cli:
    name: npm cli
    needs: platforms
    uses: ./.github/workflows/release-npm-package.yml
    with:
      dir: apps/cli
    permissions:
      contents: read
      id-token: write

  wrapper:
    name: npm wrapper
    needs: cli
    uses: ./.github/workflows/release-npm-package.yml
    with:
      dir: apps/npx
    permissions:
      contents: read
      id-token: write

  github:
    name: GitHub Release
    needs: build
    uses: ./.github/workflows/release-github.yml
    permissions:
      contents: write


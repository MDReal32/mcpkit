name: GitHub Release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: The Release run whose binaries and registry become the GitHub Release
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: github-release-${{ github.event.workflow_run.head_sha || inputs.run-id }}
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}

jobs:
  github-release:
    name: GitHub Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Find the commit of the Release run
        id: release-run
        run: echo "sha=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-run.outputs.sha }}

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Extract
        run: tar -xf release.tar

      - name: Download the registry
        uses: actions/download-artifact@v8
        with:
          name: registry
          path: registry
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Pack the registry
        run: tar -czf registry.tar.gz -C registry .

      - name: GitHub Release
        run: .github/scripts/publish-github-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.release-run.outputs.sha }}

  # winget is disabled for now; re-enable once the first MDReal32.UseMCPKit version is merged in winget-pkgs

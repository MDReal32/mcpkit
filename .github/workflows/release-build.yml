name: Release build

on:
  workflow_call:
    outputs:
      platforms:
        description: JSON array of the per-OS package directories
        value: ${{ jobs.package.outputs.platforms }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore the Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      - name: Build
        run: yarn build

      - name: Upload the credentials page
        uses: actions/upload-artifact@v7
        with:
          name: ui
          path: packages/ui/build/usemcpkit.ui.html
          if-no-files-found: error
          retention-days: 1

      - name: Upload the registry
        uses: actions/upload-artifact@v7
        with:
          name: registry
          path: packages/servers/build/manifests
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Binaries ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
            extension: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the credentials page
        uses: actions/download-artifact@v8
        with:
          name: ui
          path: packages/ui/build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p usemcpkit-runner -p usemcpkit-servers

      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/release/usemcpkit${{ matrix.extension }}
            target/release/usemcpkit-servers${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package
    needs: binaries
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.dirs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: release-binaries

      - name: Write the platform packages and the release assets
        run: node tools/release/src/main.ts release-binaries release

      - name: Pack libraries
        run: .github/scripts/publish-npm.sh pack release-tarballs

      - name: List platform packages
        id: platforms
        run: echo "dirs=$(.github/scripts/publish-npm.sh platforms)" >> "$GITHUB_OUTPUT"

      - name: Archive the release files
        run: tar -cf release.tar release release-tarballs

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar
          retention-days: 1

name: Release build

on:
  workflow_call:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore the Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      - name: Build
        run: yarn build

      - name: Upload the credentials page
        uses: actions/upload-artifact@v7
        with:
          name: ui
          path: apps/window/ui/build/usemcpkit.ui.html
          if-no-files-found: error
          retention-days: 1

      - name: Upload the libraries
        uses: actions/upload-artifact@v7
        with:
          name: libraries
          path: |
            packages/core/build
            apps/npx/build
          if-no-files-found: error
          retention-days: 1

      - name: Upload the registry
        uses: actions/upload-artifact@v7
        with:
          name: registry
          path: packages/servers/build/manifests
          if-no-files-found: error
          retention-days: 1

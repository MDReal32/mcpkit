name: Release npm package

on:
  workflow_call:
    inputs:
      dir:
        description: Workspace to publish, for example packages/core
        type: string
        required: true

jobs:
  package:
    name: Publish ${{ inputs.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Extract
        run: tar -xf release.tar

      - name: Publish
        run: .github/scripts/publish-npm.sh publish-lib "${{ inputs.dir }}" release-tarballs

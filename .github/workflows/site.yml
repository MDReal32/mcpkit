name: Site

on:
  push:
    branches:
      - master
    paths:
      - "apps/site/**"
      - "apps/video/**"
      - "yarn.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mcpkit.mdreal.org with the promo video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Restore promo video
        id: video-cache
        uses: actions/cache@v6
        with:
          path: apps/video/build/site
          key: video-${{ hashFiles('apps/video/src/**', 'apps/video/scripts/**', 'apps/video/public/sfx/**', 'apps/video/public/voiceover/**', 'apps/video/package.json', 'apps/video/remotion.config.ts', 'yarn.lock') }}

      - name: Install Chrome Headless Shell dependencies
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0

      - name: Render promo video
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          yarn workspace @usemcpkit/video remotion browser ensure
          yarn workspace @usemcpkit/video site

      - name: Build the site
        run: yarn nx run @usemcpkit/site:build

      - name: Add the promo video to the site
        run: |
          mkdir -p apps/site/build/video
          cp apps/video/build/site/usemcpkit.mp4 apps/video/build/site/poster.jpg apps/site/build/video/

      - name: Deploy to Cloudflare
        run: yarn workspace @usemcpkit/site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Release npm libraries

on:
  workflow_call:

jobs:
  libraries:
    name: Publish ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dir: [packages/core, apps/cli]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Extract
        run: tar -xf release.tar

      - name: Publish
        run: .github/scripts/publish-npm.sh publish-lib "${{ matrix.dir }}" release-tarballs

  wrapper:
    name: Publish ${{ matrix.dir }}
    needs: libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/npx]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Extract
        run: tar -xf release.tar

      - name: Publish
        run: .github/scripts/publish-npm.sh publish-lib "${{ matrix.dir }}" release-tarballs


name: Setup workspace
description: Node.js, Corepack and the Yarn dependencies of the workspace, from the cached Yarn downloads

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Restore the Yarn cache
      uses: actions/cache@v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

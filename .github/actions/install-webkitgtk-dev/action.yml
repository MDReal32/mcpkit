name: Install WebKitGTK
description: The development packages the Tauri credentials window builds against, on Linux only

runs:
  using: composite
  steps:
    - name: Install WebKitGTK
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
